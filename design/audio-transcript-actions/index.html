<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>言浪 · 语音转文字入口设计</title>
  <style>
    @font-face{font-family:SermoSans;src:url("../../src/assets/fonts/NotoSansSC-400.ttf")}@font-face{font-family:SermoSans;src:url("../../src/assets/fonts/NotoSansSC-700.ttf");font-weight:700}@font-face{font-family:SermoDisplay;src:url("../../src/assets/fonts/SpaceGrotesk-700.ttf");font-weight:700}
    :root{--ink:#14231d;--muted:#6f8078;--quiet:#96a29c;--line:#d8e1dc;--paper:#f4f3ed;--surface:#fffefa;--soft:#eaf0eb;--green:#0fc181;--green-deep:#087354;--self:#193b32;--self-ink:#f3fbf7;--shadow:0 22px 64px rgba(31,56,45,.14);--ease:cubic-bezier(.16,1,.3,1)}
    *{box-sizing:border-box}body{min-width:320px;margin:0;color:var(--ink);background:radial-gradient(circle at 92% 2%,rgba(91,195,150,.2),transparent 27%),linear-gradient(145deg,#f3efe6,#e8efea 68%,#dfe9e3);font-family:SermoSans,sans-serif}button{border:0;color:inherit;font:inherit}svg{display:block;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    body.is-dark{--ink:#eef6f2;--muted:#a4b2ab;--quiet:#74867d;--line:#2a3d34;--paper:#0d1914;--surface:#15231c;--soft:#1b2d24;--self:#2f765f;--self-ink:#f2fff9;background:radial-gradient(circle at 92% 2%,rgba(51,154,115,.15),transparent 28%),#09120e}
    .review-bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px clamp(16px,4vw,48px);border-bottom:1px solid color-mix(in srgb,var(--line) 78%,transparent);background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(22px) saturate(1.15)}.brand{display:flex;align-items:center;gap:11px}.brand-mark{display:grid;width:38px;height:38px;place-items:center;border-radius:12px;color:#effff8;background:#163d31;font:700 16px SermoDisplay}.brand strong,.brand small{display:block}.brand strong{font-size:14px}.brand small{margin-top:1px;color:var(--muted);font:700 8px SermoDisplay;letter-spacing:.14em}.theme-toggle{height:34px;padding:0 13px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--surface);font-size:11px;font-weight:700;cursor:pointer}
    .intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,410px);gap:34px;max-width:1240px;margin:auto;padding:44px clamp(18px,5vw,60px) 30px}.intro-kicker{color:var(--green-deep);font:700 10px SermoDisplay;letter-spacing:.15em}.intro h1{max-width:700px;margin:8px 0 12px;font-size:clamp(30px,4.6vw,52px);line-height:1.05;letter-spacing:-.055em}.intro p{max-width:660px;margin:0;color:var(--muted);font-size:12px;line-height:1.75}.principles{align-self:end;display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--line)}.principles span{padding:13px 11px;border-left:1px solid var(--line)}.principles span:first-child{border-left:0}.principles b,.principles small{display:block}.principles b{color:var(--green-deep);font:700 10px SermoDisplay}.principles small{margin-top:5px;color:var(--muted);font-size:9px;line-height:1.5}
    .study-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:42px 52px;max-width:980px;margin:0 auto;padding:0 28px 74px}.study{min-width:0}.study-head{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:11px;width:min(100%,390px);margin:0 auto 11px}.study-no{display:grid;width:40px;height:40px;place-items:center;border:1px solid color-mix(in srgb,var(--green-deep) 20%,var(--line));border-radius:13px;color:var(--green-deep);background:color-mix(in srgb,var(--surface) 76%,transparent);font:700 11px SermoDisplay}.study-head strong,.study-head small{display:block}.study-head strong{font-size:14px}.study-head small{margin-top:2px;color:var(--muted);font-size:10px}.study-tag{padding:5px 8px;border-radius:999px;color:var(--green-deep);background:color-mix(in srgb,var(--green) 11%,var(--surface));font-size:9px;font-weight:700}.tradeoff{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px;width:min(100%,390px);margin:10px auto 0;padding:0 4px;color:var(--muted);font-size:10px;line-height:1.6}.tradeoff b{color:var(--green-deep);font:700 8px SermoDisplay;letter-spacing:.1em}
    .phone{position:relative;width:min(100%,390px);height:520px;margin:auto;overflow:hidden;border:1px solid color-mix(in srgb,var(--line) 88%,transparent);border-radius:28px;color:var(--ink);background:var(--paper);box-shadow:var(--shadow)}.chat-head{display:flex;height:63px;align-items:center;justify-content:space-between;padding:8px 16px;border-bottom:1px solid color-mix(in srgb,var(--line) 72%,transparent);background:color-mix(in srgb,var(--paper) 84%,transparent);backdrop-filter:blur(18px)}.chat-head>span{display:flex;align-items:center;gap:9px}.chat-head img{width:34px;height:34px;border-radius:50%;object-fit:cover}.chat-head strong{display:block;font-size:13px}.chat-head small{display:block;margin-top:1px;color:var(--muted);font-size:9px}.head-more{color:var(--muted);font:700 18px SermoDisplay}.thread{position:relative;height:calc(100% - 63px);padding:34px 12px 18px;background:linear-gradient(135deg,rgba(244,236,217,.63),rgba(229,239,231,.72)),repeating-linear-gradient(45deg,transparent 0 17px,rgba(87,117,101,.035) 17px 18px)}body.is-dark .thread{background:radial-gradient(circle at 14% 20%,rgba(68,118,93,.14),transparent 34%),#101d17}.day{display:block;margin:0 auto 27px;color:var(--quiet);font:700 9px SermoDisplay;text-align:center}
    .message-row{position:relative;display:grid;align-items:end;margin:0 0 39px}.message-row.other{grid-template-columns:34px minmax(0,252px) minmax(0,1fr);gap:8px}.message-row.self{grid-template-columns:minmax(0,1fr) minmax(0,252px);gap:8px}.avatar{width:34px;height:34px;border:2px solid var(--surface);border-radius:50%;object-fit:cover;box-shadow:0 4px 13px rgba(28,45,37,.14)}.message-unit{position:relative;min-width:0}.message-row.self .message-unit{grid-column:2}.audio-bubble{position:relative;z-index:2;display:grid;grid-template-columns:34px minmax(0,1fr);align-items:center;gap:9px;width:100%;min-height:74px;padding:10px 11px;border:1px solid color-mix(in srgb,var(--line) 86%,transparent);border-radius:18px 18px 18px 7px;color:var(--ink);background:color-mix(in srgb,var(--surface) 94%,transparent);box-shadow:0 6px 17px rgba(30,51,42,.07);text-align:left;cursor:pointer}.self .audio-bubble{border-color:rgba(255,255,255,.08);border-radius:18px 18px 7px 18px;color:var(--self-ink);background:var(--self);box-shadow:0 6px 17px rgba(20,48,39,.13)}.play{display:grid;width:34px;height:34px;place-items:center;border-radius:50%;color:#123c30;background:#b7f2db}.self .play{color:var(--self-ink);background:rgba(255,255,255,.14)}.play svg{width:15px;height:15px;fill:currentColor;stroke:none}.audio-copy{display:grid;gap:8px;min-width:0}.audio-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:10px;font-weight:700}.self .audio-meta{color:rgba(242,255,249,.74)}.wave{display:flex;height:18px;align-items:end;gap:3px}.wave i{display:block;width:3px;height:calc(var(--h)*1%);min-height:3px;border-radius:99px;background:#b9c5bf}.wave i:nth-child(-n+8){background:#24be89}.self .wave i{background:rgba(255,255,255,.2)}.self .wave i:nth-child(-n+8){background:#8be5c5}.transcript{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .32s var(--ease),opacity .2s ease}.transcript>div{overflow:hidden}.message-unit.has-transcript .transcript{grid-template-rows:1fr;opacity:1}.transcript p{margin:7px 5px 0;padding:10px 11px;border-left:2px solid color-mix(in srgb,var(--green) 55%,transparent);color:var(--muted);background:color-mix(in srgb,var(--surface) 62%,transparent);font-size:11px;line-height:1.55}.self .transcript p{margin-left:auto;color:var(--muted)}
    .side-action,.below-action,.meta-action{color:var(--muted);cursor:pointer}.side-action{position:absolute;z-index:5;top:50%;display:inline-flex;height:25px;align-items:center;gap:3px;padding:0 7px;border:1px solid color-mix(in srgb,var(--line) 74%,transparent);border-radius:999px;background:color-mix(in srgb,var(--surface) 77%,transparent);box-shadow:0 4px 12px rgba(28,48,39,.06);font-size:9px;font-weight:700;transform:translateY(-50%)}.other .side-action{right:-59px}.self .side-action{left:-59px}.side-action svg,.below-action svg,.meta-action svg{width:13px;height:13px}.below-action,.meta-action,.meta-line{display:none}.context-menu{position:absolute;z-index:8;right:5px;bottom:calc(100% + 9px);display:none;grid-template-columns:repeat(3,1fr);width:188px;padding:5px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 14px 35px rgba(24,44,35,.16)}.context-menu button{display:grid;justify-items:center;gap:3px;min-height:48px;padding:6px;border-radius:10px;color:var(--muted);background:transparent;font-size:9px;font-weight:700}.context-menu button.is-transcribe{color:var(--green-deep);background:color-mix(in srgb,var(--green) 10%,transparent)}.context-menu svg{width:17px;height:17px}.hold-hint{display:none;margin-top:7px;color:var(--quiet);font-size:9px;text-align:center}
    .v1 .side-action{opacity:.72}.v1 .side-action:hover{opacity:1;color:var(--green-deep)}
    .v2 .side-action{width:27px;padding:0;justify-content:center;border-color:transparent;background:color-mix(in srgb,var(--soft) 82%,transparent);box-shadow:none;font-size:0}.v2 .other .side-action{right:-35px}.v2 .self .side-action{left:-35px}.v2 .side-action svg{width:14px;height:14px;opacity:.7}.v2 .side-action:hover{color:var(--green-deep);background:var(--soft)}
    .v3 .side-action{display:none}.v3 .below-action{display:inline-flex;height:23px;align-items:center;gap:4px;margin-top:4px;padding:0 5px;border-radius:7px;background:transparent;font-size:9px;font-weight:700;opacity:.72}.v3 .other .below-action{float:right}.v3 .self .below-action{float:left}.v3 .below-action:hover{color:var(--green-deep);background:var(--soft);opacity:1}
    .v4 .side-action{display:none}.v4 .meta-line{display:flex;align-items:center;gap:8px;margin-top:5px;padding:0 4px;color:var(--quiet);font-size:9px}.v4 .self .meta-line{justify-content:flex-end}.v4 .meta-action{display:inline-flex;align-items:center;gap:3px;padding:0;background:transparent;font-size:9px}.v4 .meta-line i{width:2px;height:2px;border-radius:50%;background:currentColor}.v4 .meta-action:hover{color:var(--green-deep)}
    .v5 .side-action{display:none}.v5 .hold-hint{display:block}.v5 .message-unit.menu-open .context-menu{display:grid;animation:menu-in .22s var(--ease)}.v5 .message-unit.menu-open .audio-bubble{box-shadow:0 0 0 2px color-mix(in srgb,var(--green) 22%,transparent),0 7px 18px rgba(24,48,38,.1)}
    .v6 .side-action{pointer-events:none;opacity:0;transform:translateY(-50%) translateX(7px);transition:opacity .18s ease,transform .24s var(--ease)}.v6 .self .side-action{transform:translateY(-50%) translateX(-7px)}.v6 .message-unit.is-selected .side-action{pointer-events:auto;opacity:.82;transform:translateY(-50%) translateX(0)}.v6 .message-unit.is-selected .audio-bubble{box-shadow:0 0 0 2px color-mix(in srgb,var(--green) 15%,transparent),0 7px 18px rgba(24,48,38,.09)}
    @keyframes menu-in{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}.toast{position:fixed;z-index:80;right:24px;bottom:24px;padding:9px 13px;border-radius:999px;color:#effff8;background:#153c30;box-shadow:0 12px 30px rgba(12,37,28,.22);font-size:10px;font-weight:700;opacity:0;pointer-events:none;transform:translateY(8px);transition:.25s var(--ease)}.toast.is-visible{opacity:1;transform:none}
    @media(max-width:920px){.intro{grid-template-columns:1fr;padding-top:30px}.principles{display:none}.study-grid{grid-template-columns:1fr;max-width:520px}.review-bar{padding-inline:15px}}@media(max-width:520px){.brand small{display:none}.intro{padding-inline:17px}.intro h1{font-size:31px}.study-grid{padding-inline:0;gap:35px}.study-head,.tradeoff{padding-inline:15px}.phone{border-inline:0;border-radius:0}.message-row.other{grid-template-columns:34px minmax(0,252px) minmax(0,1fr)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  </style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs><symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7z"/></symbol><symbol id="i-text" viewBox="0 0 24 24"><path d="M4 6h16M12 6v12M8 18h8"/></symbol><symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol><symbol id="i-forward" viewBox="0 0 24 24"><path d="m15 7 5 5-5 5v-3h-4.5a7.5 7.5 0 0 0-6.5 4 6.5 6.5 0 0 1 6.5-8H15V7Z"/></symbol></defs></svg>
  <header class="review-bar"><div class="brand"><span class="brand-mark">S</span><span><strong>Sermo 言浪</strong><small>AUDIO TRANSCRIPT STUDY</small></span></div><button class="theme-toggle" id="theme-toggle" type="button">深色模式</button></header>
  <main>
    <section class="intro"><div><span class="intro-kicker">390 CSS PX · SIX DIRECTIONS</span><h1>让“转文字”靠近语音，<br/>但不住进气泡。</h1><p>语音气泡只负责播放。转写作为二级动作退到气泡外，并始终朝向屏幕中线，避免与头像、发送状态和消息边缘争夺注意力。</p></div><div class="principles"><span><b>01</b><small>不改变播放区<br/>的触控语义</small></span><span><b>02</b><small>己方在左<br/>他方在右</small></span><span><b>03</b><small>文字展开后<br/>仍归属原语音</small></span></div></section>
    <section class="study-grid" id="study-grid"></section>
  </main>
  <div class="toast" id="toast">已展开转写</div>
  <script>
    const studies=[
      {id:'v1',title:'中线轻胶囊',subtitle:'常驻文字，方向明确',tag:'易发现',note:'最直观，但长语音会压缩中线留白。适合把转写作为高频能力。'},
      {id:'v2',title:'雾点图标',subtitle:'只留一个文字符号',tag:'最克制',note:'横向只占 27px，对长语音最友好；首次使用需要依赖图标语义。'},
      {id:'v3',title:'下沿签注',subtitle:'沿气泡底边自然落款',tag:'不挤中线',note:'不占气泡同行宽度，阅读顺序自然；会轻微增加每条语音的纵向高度。'},
      {id:'v4',title:'时间同轨',subtitle:'作为消息元信息出现',tag:'秩序感',note:'最像系统级辅助能力，视觉稳定；操作入口离语音主体略远。'},
      {id:'v5',title:'长按菜单',subtitle:'完全取消常驻入口',tag:'零干扰',note:'气泡最纯净，但发现性最低。建议只在用户已经熟悉长按操作时采用。'},
      {id:'v6',title:'点按渐显',subtitle:'选择语音后再出现',tag:'渐进式',note:'兼顾纯净与发现性，第一次点按仍播放，需明确区分“播放键”和“选择气泡”。'}
    ];
    const bars=[34,62,46,82,55,95,42,72,88,50,68,38,79,56,91,45];
    const icon=(id)=>`<svg aria-hidden="true" viewBox="0 0 24 24"><use href="#i-${id}"/></svg>`;
    const action=(label='转文字')=>`<button aria-label="${label}" class="side-action js-transcribe" type="button">${icon('text')}<span>${label}</span></button>`;
    const row=(side,variant,index)=>`<div class="message-row ${side}">${side==='other'?'<img class="avatar" src="/assets/avatars/v2/14.png" alt="Fly"/>':''}<div class="message-unit ${(variant==='v5'&&side==='other')?'menu-open ':''}${(variant==='v6'&&side==='self')?'is-selected':''}">${action()}<div class="context-menu"><button type="button">${icon('copy')}<span>复制</span></button><button class="is-transcribe js-transcribe" type="button">${icon('text')}<span>转文字</span></button><button type="button">${icon('forward')}<span>转发</span></button></div><div class="audio-bubble" role="button" tabindex="0"><span class="play">${icon('play')}</span><span class="audio-copy"><span class="audio-meta"><b>语音消息</b><time>0:00 / 0:${index===0?'12':'08'}</time></span><span class="wave">${bars.map(h=>`<i style="--h:${h}"></i>`).join('')}</span></span></div><button class="below-action js-transcribe" type="button">${icon('text')}<span>转文字</span></button><div class="meta-line"><time>${side==='other'?'21:46':'21:48'}</time><i></i><button class="meta-action js-transcribe" type="button">${icon('text')}<span>转文字</span></button></div><span class="hold-hint">长按语音查看更多操作</span><div class="transcript"><div><p>${side==='other'?'明天下午三点，我们在图书馆门口见。':'好，我会提前十分钟到。'}</p></div></div></div></div>`;
    const phone=(study,index)=>`<article class="study"><header class="study-head"><span class="study-no">${String(index+1).padStart(2,'0')}</span><span><strong>${study.title}</strong><small>${study.subtitle}</small></span><span class="study-tag">${study.tag}</span></header><div class="phone ${study.id}" data-variant="${study.id}"><header class="chat-head"><span><img src="/assets/avatars/v2/14.png" alt="Fly"/><span><strong>Fly</strong><small>现在在线</small></span></span><span class="head-more">•••</span></header><div class="thread"><time class="day">今天 21:46</time>${row('other',study.id,0)}${row('self',study.id,1)}</div></div><p class="tradeoff"><b>取舍</b><span>${study.note}</span></p></article>`;
    document.querySelector('#study-grid').innerHTML=studies.map(phone).join('');
    const toast=document.querySelector('#toast');let toastTimer;
    const flash=()=>{toast.classList.add('is-visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('is-visible'),1000)};
    document.querySelectorAll('.js-transcribe').forEach(button=>button.addEventListener('click',event=>{event.stopPropagation();const unit=button.closest('.message-unit');unit.classList.toggle('has-transcript');unit.classList.remove('menu-open');flash()}));
    document.querySelectorAll('.phone.v5 .audio-bubble').forEach(bubble=>{let timer;bubble.addEventListener('pointerdown',()=>{timer=setTimeout(()=>bubble.closest('.message-unit').classList.add('menu-open'),420)});['pointerup','pointerleave','pointercancel'].forEach(type=>bubble.addEventListener(type,()=>clearTimeout(timer)));bubble.addEventListener('click',()=>bubble.closest('.message-unit').classList.toggle('menu-open'))});
    document.querySelectorAll('.phone.v6 .audio-bubble').forEach(bubble=>bubble.addEventListener('click',()=>bubble.closest('.message-unit').classList.toggle('is-selected')));
    document.querySelector('#theme-toggle').addEventListener('click',event=>{document.body.classList.toggle('is-dark');event.currentTarget.textContent=document.body.classList.contains('is-dark')?'浅色模式':'深色模式'});
  </script>
</body>
</html>
