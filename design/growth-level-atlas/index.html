<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>等级图鉴 · 四种设计</title>
  <style>
    @font-face{font-family:Noto;src:url('../../src/assets/fonts/NotoSansSC-400.ttf')}@font-face{font-family:Noto;src:url('../../src/assets/fonts/NotoSansSC-700.ttf');font-weight:700}@font-face{font-family:Space;src:url('../../src/assets/fonts/SpaceGrotesk-700.ttf');font-weight:700}
    :root{--ink:#10251f;--muted:#71827c;--paper:#f4f1e8;--line:#d9dfd9;--green:#16b889;--stage:#298e72;--stage-soft:#dff3ea;--shadow:0 24px 70px rgba(4,24,18,.18)}
    *{box-sizing:border-box}body{margin:0;background:#10211c;color:var(--ink);font-family:Noto,sans-serif}.review-shell{min-height:100vh;padding:22px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;background:radial-gradient(circle at 82% 10%,#27483e 0,transparent 28%),#10211c}.review-nav{position:sticky;top:22px;align-self:start;color:#eef8f4}.review-nav h1{font:700 30px/1 Space;margin:4px 0 10px}.review-nav>p{color:#9db5ad;font-size:13px;line-height:1.7;margin:0 0 24px}.scheme-nav{display:grid;gap:8px}.scheme-nav button,.view-toggle button{border:1px solid #36534a;background:#172b25;color:#b8cbc5;border-radius:15px;padding:13px;text-align:left;font:inherit;cursor:pointer}.scheme-nav button.active{background:#e8f4ef;color:#11271f;border-color:#e8f4ef}.scheme-nav small{display:block;opacity:.65;margin-top:3px}.view-toggle{display:flex;gap:7px;margin-top:18px}.view-toggle button{flex:1;text-align:center;padding:9px}.view-toggle button.active{color:#071d16;background:#68dbb5;border-color:#68dbb5}.stage-key{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}.stage-key i{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.6)}
    .stage{--stage:#298e72;--stage-soft:#dff3ea}.s-plain{--stage:#b4bab5;--stage-soft:#f2f3f0}.s-basic{--stage:#6e7b78;--stage-soft:#e7ebe8}.s-selected{--stage:#22956f;--stage-soft:#dff3ea}.s-rare{--stage:#3279d3;--stage-soft:#e1edfb}.s-epic{--stage:#845bd6;--stage-soft:#eee7fb}.s-collectible{--stage:#d68a25;--stage-soft:#faecd5}.s-mythic{--stage:#d74642;--stage-soft:#fbe3e1}
    .stage-wrap{min-width:0;display:grid;place-items:center}.device{width:min(100%,1180px);height:calc(100vh - 44px);min-height:690px;background:var(--paper);border-radius:30px;overflow:hidden;box-shadow:var(--shadow);transition:.25s}.device.mobile{width:430px}.app{height:100%;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(145deg,#f8f5ed,#eef6f0)}.app-head{height:78px;flex:0 0 auto;padding:0 28px;display:flex;align-items:center;gap:16px;border-bottom:1px solid rgba(16,37,31,.1);background:rgba(250,249,244,.8);backdrop-filter:blur(18px)}.back{font-size:30px}.app-head strong{font-size:23px}.app-head small{margin-left:auto;color:var(--muted)}.screen{display:none;min-height:0;flex:1;overflow:auto}.screen.active{display:block}.section-eyebrow{font:700 11px/1 Space;letter-spacing:.16em;color:var(--stage);text-transform:uppercase}.level-title{font:700 54px/.9 Space}.level-title small{font:700 14px/1 Noto;margin-right:4px}.stage-pill{display:inline-flex;padding:6px 11px;border-radius:999px;background:var(--stage-soft);color:var(--stage);font-weight:700;font-size:12px}.reward-title{font-size:13px;color:var(--muted);font-weight:700}.reward-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.reward{position:relative;min-width:0;border:1px solid color-mix(in srgb,var(--stage) 22%,#d7ddd8);background:rgba(255,255,255,.74);border-radius:17px;padding:11px;overflow:hidden}.reward b{display:block;margin-top:7px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.reward small{color:var(--muted);font-size:10px}.reward-preview{height:56px;border-radius:11px;background:var(--stage-soft);display:grid;place-items:center;overflow:hidden}.reward.capability .reward-preview{font-size:24px;background:linear-gradient(135deg,var(--stage-soft),#fff)}.reward.bubble .reward-preview span{padding:7px 16px;border-radius:16px 16px 5px 16px;background:var(--stage);color:white;font-size:11px;box-shadow:4px 4px 0 color-mix(in srgb,var(--stage) 45%,#f4b64b)}.reward.background .reward-preview{background:radial-gradient(circle at 18% 20%,#fff8 0 6%,transparent 7%),repeating-linear-gradient(120deg,var(--stage-soft) 0 12px,color-mix(in srgb,var(--stage) 18%,white) 12px 24px)}.reward.avatar .reward-preview span{width:38px;height:38px;border-radius:13px;background:url('../../public/assets/avatars/v2/14.png') center/cover;border:4px double var(--stage);box-shadow:0 0 0 4px color-mix(in srgb,var(--stage) 18%,transparent)}.reward.profile .reward-preview span{width:72%;height:38px;border-radius:10px;background:linear-gradient(90deg,var(--stage),#edc06e);position:relative}.reward.profile .reward-preview span:after{content:'';position:absolute;width:22px;height:22px;background:#fff;border-radius:8px;left:8px;bottom:-6px}.level-buttons button{font:700 12px Space;border:0;cursor:pointer}.desktop-only{display:block}
    /* 01 长卷 */
    .scroll-layout{display:grid;grid-template-columns:minmax(245px,.82fr) minmax(320px,1.18fr);min-height:100%;padding:28px;gap:28px}.scroll-hero{position:sticky;top:0;align-self:start;padding:26px;border-radius:26px;background:var(--stage-soft);overflow:hidden}.scroll-hero:after{content:'';position:absolute;width:220px;height:220px;border:1px solid var(--stage);border-radius:50%;right:-90px;top:-90px;opacity:.18}.scroll-hero p{font-size:13px;color:var(--muted);margin:15px 0 20px}.scroll-map{position:relative;padding:18px 0 50px}.scroll-map:before{content:'';position:absolute;left:33px;top:30px;bottom:60px;width:2px;background:linear-gradient(var(--stage),#d9dfda)}.scroll-node{position:relative;display:grid;grid-template-columns:68px 1fr;gap:14px;width:100%;border:0;background:transparent;text-align:left;padding:10px 0;cursor:pointer}.scroll-node .num{z-index:1;width:68px;height:68px;display:grid;place-items:center;border-radius:24px;background:#fbfaf6;border:1px solid #d7dfda;font:700 20px Space;color:#89958f}.scroll-node .copy{padding:11px 16px;border-radius:18px;background:rgba(255,255,255,.66);border:1px solid transparent}.scroll-node .copy b{display:block}.scroll-node .copy small{color:var(--muted)}.scroll-node.done .num,.scroll-node.active .num{background:var(--stage);color:white;border-color:var(--stage)}.scroll-node.active .copy{border-color:var(--stage);box-shadow:0 12px 30px color-mix(in srgb,var(--stage) 15%,transparent)}
    /* 02 陈列馆 */
    .museum-layout{min-height:100%;padding:26px;display:grid;grid-template-columns:180px 1fr;gap:22px}.museum-levels{border-right:1px solid var(--line);padding-right:18px}.museum-levels h2{font:700 13px Space;color:var(--muted)}.museum-levels .level-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.museum-levels button{aspect-ratio:1;border-radius:12px;background:#e9ede9;color:#73827c}.museum-levels button.active{background:var(--stage);color:white}.museum-stage{min-width:0}.museum-stage-head{height:180px;border-radius:26px;padding:24px;background:linear-gradient(120deg,var(--stage),color-mix(in srgb,var(--stage) 45%,#f5c06b));color:white;display:flex;align-items:end;justify-content:space-between;overflow:hidden}.museum-stage-head .level-title{font-size:72px}.museum-stage-head p{max-width:260px;text-align:right;opacity:.78;font-size:12px}.museum-shelf{margin-top:20px}.museum-shelf>header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.museum-shelf .reward-grid{grid-template-columns:repeat(4,minmax(130px,1fr))}.museum-shelf .reward{min-height:138px}.museum-shelf .reward-preview{height:72px}
    /* 03 星图 */
    .constellation{min-height:100%;padding:26px;position:relative;overflow:hidden;background:radial-gradient(circle at 70% 28%,color-mix(in srgb,var(--stage) 25%,transparent),transparent 35%),#10241f;color:white}.constellation:before{content:'';position:absolute;inset:0;background-image:radial-gradient(#fff9 1px,transparent 1px);background-size:32px 32px;opacity:.18}.star-head,.star-body{position:relative}.star-head{display:flex;justify-content:space-between;align-items:start}.star-head p{color:#9bb2aa;max-width:380px}.stage-orbits{height:330px;position:relative;margin-top:8px}.orbit{position:absolute;border:1px solid color-mix(in srgb,var(--stage) 44%,transparent);border-radius:50%;left:7%;right:7%;top:12%;bottom:7%}.orbit.o2{left:18%;right:18%;top:24%;bottom:20%}.orbit.o3{left:31%;right:31%;top:36%;bottom:33%}.star-level{position:absolute;width:52px;height:52px;border:1px solid #ffffff55;border-radius:50%;background:#17342c;color:white;cursor:pointer;font:700 13px Space;box-shadow:0 0 0 7px #ffffff08}.star-level.active{background:var(--stage);box-shadow:0 0 0 9px color-mix(in srgb,var(--stage) 20%,transparent),0 0 28px var(--stage)}.star-level:nth-child(1){left:8%;top:59%}.star-level:nth-child(2){left:18%;top:24%}.star-level:nth-child(3){left:31%;top:69%}.star-level:nth-child(4){left:44%;top:18%}.star-level:nth-child(5){left:57%;top:64%}.star-level:nth-child(6){left:71%;top:25%}.star-level:nth-child(7){left:84%;top:55%}.star-detail{display:grid;grid-template-columns:170px 1fr;gap:20px;border-top:1px solid #ffffff24;padding-top:18px}.star-detail .reward{background:#18342d;border-color:#ffffff20;color:white}.star-detail .reward small,.star-detail .reward-title{color:#9bb2aa}
    /* 04 护照 */
    .passport{min-height:100%;padding:28px;background:#e9dfc8}.passport-book{min-height:590px;display:grid;grid-template-columns:1fr 1fr;background:#fbf5e6;border-radius:10px 24px 24px 10px;box-shadow:0 22px 50px #624c2a3b;overflow:hidden}.passport-page{padding:28px;position:relative;background-image:linear-gradient(90deg,transparent 97%,#b99f7140 100%),radial-gradient(#b9a67e44 .7px,transparent .8px);background-size:auto,12px 12px}.passport-page+.passport-page{border-left:1px solid #cfc09e}.passport-kicker{font:700 11px Space;letter-spacing:.2em;color:#8e7b56}.passport-level{margin:22px 0;display:flex;align-items:center;gap:18px}.passport-stamp{width:120px;height:120px;border:3px double var(--stage);border-radius:50%;display:grid;place-items:center;transform:rotate(-7deg);color:var(--stage);font:700 36px Space}.passport-level h2{font-size:27px;margin:0}.passport-level p{color:#7f725b;font-size:12px}.passport-pages{display:flex;gap:7px;flex-wrap:wrap}.passport-pages button{width:38px;height:30px;border:1px solid #b9a67e;background:#f6edd9;color:#806f51;border-radius:5px;cursor:pointer;font:700 11px Space}.passport-pages button.active{background:var(--stage);color:white;border-color:var(--stage)}.ticket-stack{display:grid;gap:10px;margin-top:20px}.ticket{display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;border:1px dashed #9f8b64;border-radius:8px;padding:12px}.ticket-icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--stage-soft);color:var(--stage);font-size:20px}.ticket b,.ticket small{display:block}.ticket small{color:#887a60}.ticket em{font:700 9px Space;color:var(--stage);font-style:normal;writing-mode:vertical-rl;letter-spacing:.12em}
    .device.mobile .app-head{height:66px;padding:0 18px}.device.mobile .app-head strong{font-size:19px}.device.mobile .scroll-layout{display:block;padding:18px}.device.mobile .scroll-hero{position:relative}.device.mobile .scroll-map{padding-left:4px}.device.mobile .museum-layout{display:block;padding:18px}.device.mobile .museum-levels{border:0;padding:0;margin-bottom:16px}.device.mobile .museum-levels .level-buttons{display:flex;overflow:auto}.device.mobile .museum-levels button{flex:0 0 42px;aspect-ratio:1}.device.mobile .museum-stage-head{height:145px}.device.mobile .museum-shelf .reward-grid{display:flex;overflow:auto}.device.mobile .museum-shelf .reward{flex:0 0 150px}.device.mobile .constellation{padding:18px}.device.mobile .stage-orbits{height:300px}.device.mobile .star-level{width:44px;height:44px}.device.mobile .star-detail{grid-template-columns:1fr}.device.mobile .star-detail .level-title{font-size:44px}.device.mobile .passport{padding:14px}.device.mobile .passport-book{display:block}.device.mobile .passport-page+.passport-page{border:0;border-top:1px solid #cfc09e}.device.mobile .passport-page{padding:20px}.device.mobile .passport-stamp{width:90px;height:90px}.device.mobile .desktop-only{display:none}
    @media(max-width:760px){.review-shell{display:block;padding:0}.review-nav{position:relative;top:auto;padding:18px}.review-nav>p,.stage-key{display:none}.scheme-nav{display:flex;overflow:auto}.scheme-nav button{flex:0 0 150px}.view-toggle{display:none}.stage-wrap{display:block}.device,.device.mobile{width:100%;height:calc(100vh - 182px);min-height:620px;border-radius:28px 28px 0 0}.app-head{height:66px;padding:0 18px}.app-head strong{font-size:19px}.scroll-layout{display:block;padding:18px}.scroll-hero{position:relative}.scroll-map{padding-left:4px}.museum-layout{display:block;padding:18px}.museum-levels{border:0;padding:0;margin-bottom:16px}.museum-levels .level-buttons{display:flex;overflow:auto}.museum-levels button{flex:0 0 42px;aspect-ratio:1}.museum-stage-head{height:145px}.museum-shelf .reward-grid{display:flex;overflow:auto}.museum-shelf .reward{flex:0 0 150px}.constellation{padding:18px}.stage-orbits{height:300px}.star-level{width:44px;height:44px}.star-detail{grid-template-columns:1fr}.star-detail .level-title{font-size:44px}.passport{padding:14px}.passport-book{display:block}.passport-page+.passport-page{border:0;border-top:1px solid #cfc09e}.passport-page{padding:20px}.passport-stamp{width:90px;height:90px}.desktop-only{display:none}}
  </style>
</head>
<body>
  <main class="review-shell">
    <aside class="review-nav">
      <h1>LEVEL ATLAS</h1>
      <p>四种等级图鉴方向。点击方案与等级，重点审阅成长路径和奖励的表达方式。</p>
      <nav class="scheme-nav">
        <button class="active" data-screen="scroll">01 成长长卷<small>先看旅程，再看奖励</small></button>
        <button data-screen="museum">02 奖励陈列馆<small>让解锁内容成为主角</small></button>
        <button data-screen="stars">03 七阶星图<small>强调阶段跃迁与探索</small></button>
        <button data-screen="passport">04 等级护照<small>强化收藏与拥有感</small></button>
      </nav>
      <div class="view-toggle"><button class="active" data-view="desktop">桌面</button><button data-view="mobile">手机</button></div>
      <div class="stage-key"><i style="background:#fff"></i><i style="background:#6e7b78"></i><i style="background:#22956f"></i><i style="background:#3279d3"></i><i style="background:#845bd6"></i><i style="background:#d68a25"></i><i style="background:#d74642"></i></div>
    </aside>
    <section class="stage-wrap"><div class="device"><div class="app">
      <header class="app-head"><span class="back">‹</span><strong>等级图鉴</strong><small>当前 LV 8</small></header>
      <section class="screen active" id="scroll"></section>
      <section class="screen" id="museum"></section>
      <section class="screen" id="stars"></section>
      <section class="screen" id="passport"></section>
    </div></div></section>
  </main>
  <script>
    const stages=[['plain','素朴'],['basic','基础'],['selected','精选'],['rare','稀有'],['epic','史诗'],['collectible','典藏'],['mythic','神话']];
    const names=['初见','开聊','声动','相聚','成片','自在','熟络','漫游','成章','收藏','识趣','成景','入境','留痕','共鸣','藏光','尽兴','言浪'];
    const rewardPool=[
      [{type:'capability',icon:'✦',title:'基础沟通',hint:'功能能力'},{type:'background',title:'默认背景',hint:'聊天背景'}],
      [{type:'capability',icon:'▧',title:'发送图片',hint:'聊天能力'},{type:'bubble',title:'马赛克气泡',hint:'聊天气泡'}],
      [{type:'capability',icon:'◖',title:'语音与位置',hint:'聊天能力'},{type:'avatar',title:'拍立得头像框',hint:'头像框'}],
      [{type:'capability',icon:'＋',title:'创建群聊',hint:'通讯能力'},{type:'background',title:'漫画背景',hint:'聊天背景'}],
      [{type:'capability',icon:'▶',title:'发送视频',hint:'聊天能力'},{type:'bubble',title:'英雄刊气泡',hint:'聊天气泡'}],
      [{type:'capability',icon:'✎',title:'自定义欢迎语',hint:'个人资料'},{type:'background',title:'枯山水',hint:'聊天背景'}],
      [{type:'capability',icon:'⌁',title:'上线提醒',hint:'提醒能力'},{type:'avatar',title:'机械环',hint:'头像框'}],
      [{type:'capability',icon:'↓',title:'下载语音',hint:'聊天能力'},{type:'bubble',title:'游龙气泡',hint:'聊天气泡'}],
      [{type:'capability',icon:'⌂',title:'自定义聊天背景',hint:'个性化'},{type:'background',title:'极光天幕',hint:'聊天背景'}],
      [{type:'capability',icon:'◇',title:'自定义消息提示',hint:'通知能力'},{type:'avatar',title:'永久 VIP',hint:'头像框'}],
      [{type:'bubble',title:'城市收藏气泡',hint:'聊天气泡'},{type:'background',title:'幻彩膜',hint:'聊天背景'}],
      [{type:'profile',title:'潮汐蓝名片',hint:'个人名片'},{type:'capability',icon:'▱',title:'名片主题系统',hint:'个人资料'}],
      [{type:'avatar',title:'极光头像框',hint:'头像框'},{type:'background',title:'太空港',hint:'聊天背景'}],
      [{type:'capability',icon:'↝',title:'动态轨迹',hint:'社交表达'},{type:'bubble',title:'景德镇气泡',hint:'聊天气泡'}],
      [{type:'avatar',title:'Niko 头像框',hint:'头像框'},{type:'bubble',title:'Niko 气泡',hint:'聊天气泡'}],
      [{type:'avatar',title:'Fufu 头像框',hint:'头像框'},{type:'bubble',title:'Fufu 气泡',hint:'聊天气泡'}],
      [{type:'background',title:'黑色电影',hint:'聊天背景'},{type:'profile',title:'鎏金时刻',hint:'个人名片'}],
      [{type:'capability',icon:'◉',title:'尽兴徽记',hint:'最终成就'},{type:'bubble',title:'神话纪念气泡',hint:'聊天气泡'}]
    ];
    const stageFor=l=>l<=2?0:l<=5?1:l<=8?2:l<=11?3:l<=14?4:l<=17?5:6;
    const levels=names.map((name,i)=>({level:i+1,name,stage:stageFor(i+1),score:[0,40,100,180,300,460,680,960,1320,1780,2360,3080,3960,5020,6300,7820,9620,11750][i],rewards:rewardPool[i]}));
    let active=8;
    const rewardHTML=r=>`<article class="reward ${r.type}"><div class="reward-preview"><span>${r.icon||''}</span></div><b>${r.title}</b><small>${r.hint}</small></article>`;
    const stageClass=l=>`stage s-${stages[stageFor(l)-0][0]}`;
    function render(){const x=levels[active-1],sc=stageClass(active),rewards=x.rewards.map(rewardHTML).join('');
      document.querySelector('#scroll').innerHTML=`<div class="scroll-layout ${sc}"><aside class="scroll-hero"><span class="section-eyebrow">CURRENT CHAPTER</span><div class="level-title"><small>LV</small>${String(x.level).padStart(2,'0')}</div><h2>${x.name}</h2><span class="stage-pill">${stages[x.stage][1]}阶段</span><p>${x.score.toLocaleString()} 成长值抵达。能力是通行证，外观是这一程真正留下的收藏。</p><div class="reward-title">本级解锁</div><div class="reward-grid">${rewards}</div></aside><div class="scroll-map">${levels.map(l=>`<button class="scroll-node ${l.level<8?'done':''} ${l.level===active?'active':''}" data-level="${l.level}"><span class="num">${String(l.level).padStart(2,'0')}</span><span class="copy"><b>${l.name}</b><small>${l.rewards.map(r=>r.title).join(' · ')}</small></span></button>`).join('')}</div></div>`;
      document.querySelector('#museum').innerHTML=`<div class="museum-layout ${sc}"><aside class="museum-levels"><span class="section-eyebrow">COLLECTION INDEX</span><h2>18 个等级</h2><div class="level-buttons">${levels.map(l=>`<button class="${l.level===active?'active':''}" data-level="${l.level}">${String(l.level).padStart(2,'0')}</button>`).join('')}</div></aside><div class="museum-stage"><div class="museum-stage-head"><div><span class="section-eyebrow" style="color:white">LEVEL COLLECTION</span><div class="level-title"><small>LV</small>${String(x.level).padStart(2,'0')}</div><h2>${x.name}</h2></div><p>达到 ${x.score.toLocaleString()} 成长值<br>${stages[x.stage][1]}阶段收藏</p></div><section class="museum-shelf"><header><strong>本级入藏</strong><span class="stage-pill">${x.rewards.length} 项奖励</span></header><div class="reward-grid">${rewards}</div></section><section class="museum-shelf"><header><strong>能力与外观分开展示</strong><small>外观直接看效果，能力只保留必要说明</small></header></section></div></div>`;
      const stageLevels=stages.map((s,i)=>levels.filter(l=>l.stage===i)[0]);
      document.querySelector('#stars').innerHTML=`<div class="constellation ${sc}"><header class="star-head"><div><span class="section-eyebrow">SEVEN STAGES</span><h2>七阶成长星图</h2></div><p>十八个等级不再平铺，而是聚合成七次明显跃迁。每颗亮星都对应一组新能力与收藏。</p></header><div class="stage-orbits"><i class="orbit"></i><i class="orbit o2"></i><i class="orbit o3"></i>${stageLevels.map((l,i)=>`<button class="star-level ${l.stage===x.stage?'active':''}" data-level="${l.level}" title="${stages[i][1]}">${String(l.level).padStart(2,'0')}</button>`).join('')}</div><div class="star-detail"><div><span class="section-eyebrow">${stages[x.stage][1]}星域</span><div class="level-title"><small>LV</small>${String(x.level).padStart(2,'0')}</div><h2>${x.name}</h2></div><div><div class="reward-title">星域奖励</div><div class="reward-grid">${rewards}</div></div></div></div>`;
      document.querySelector('#passport').innerHTML=`<div class="passport ${sc}"><div class="passport-book"><section class="passport-page"><span class="passport-kicker">SERMO GROWTH PASSPORT</span><div class="passport-level"><div class="passport-stamp">LV${x.level}</div><div><h2>${x.name}</h2><p>${stages[x.stage][1]}阶段<br>${x.score.toLocaleString()} 成长值</p></div></div><div class="passport-pages">${levels.map(l=>`<button class="${l.level===active?'active':''}" data-level="${l.level}">${String(l.level).padStart(2,'0')}</button>`).join('')}</div></section><section class="passport-page"><span class="passport-kicker">ENTRY VISAS · 本级签注</span><div class="ticket-stack">${x.rewards.map((r,i)=>`<article class="ticket"><span class="ticket-icon">${r.icon||['◫','◌','✦'][i%3]}</span><span><b>${r.title}</b><small>${r.hint} · 已写入成长护照</small></span><em>UNLOCKED</em></article>`).join('')}</div></section></div></div>`;
      document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{active=+b.dataset.level;render()});
    }
    render();
    document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-screen]').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#'+b.dataset.screen).classList.add('active')});
    document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('.device').classList.toggle('mobile',b.dataset.view==='mobile')});
  </script>
</body>
</html>
