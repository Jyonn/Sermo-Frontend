# Keep this server on the old wildcard host after sermo.jyonn.space moves to GitHub Pages.
# The wildcard certificate must still cover *.sermo.jyonn.space.
server {
    listen 80;
    listen 443 ssl http2;
    server_name ~^(?<space_slug>[^.]+)\.sermo\.jyonn\.space$;

    ssl_certificate /etc/letsencrypt/live/sermo.jyonn.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sermo.jyonn.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://sermo.jyonn.space/$space_slug$request_uri;
}
