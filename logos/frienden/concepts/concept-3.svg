  <g id="icon" transform="translate(64 64)">
    <path fill="#173C31" d="M56 0h286v88H144v68h150v84H144v144H56V0Z"/>
    <path fill="#00BD78" d="M208 240h134v144H208v-82h-64v-62h64Z"/>
