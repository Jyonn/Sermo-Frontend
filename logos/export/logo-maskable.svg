<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SERMO maskable app icon</title>
  <desc id="desc">SERMO wordmark with a safe margin for adaptive app-icon masks.</desc>
  <rect id="background" width="512" height="512" fill="#FBFAF7"/>
  <g id="wordmark" fill="#11110F">
    <text x="256" y="297" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="112" font-stretch="condensed" font-weight="700" letter-spacing="-9" textLength="356" lengthAdjust="spacingAndGlyphs">SERMO</text>
  </g>
</svg>
