<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frienden DEV 头像</title><style>body{margin:0;padding:32px;background:#eae7df;color:#24372e;font-family:Georgia,serif}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;max-width:1000px;margin:auto}article{padding:20px;background:#fffdf6;border-radius:20px}img{width:100%;aspect-ratio:1}h1{max-width:1000px;margin:0 auto 28px}p{font-size:14px;line-height:1.6}.sizes{display:flex;gap:16px;align-items:center}.sizes img{width:64px}.sizes img:last-child{width:32px}</style><h1>Frienden + DEV</h1><main><article><img src="concept-1.png" alt="浅色代码铭牌"><h2>01 · 代码铭牌</h2><p>推荐：保留四色纸感主标，下方以代码括号收拢 DEV，识别清楚而不抢主标。</p><div class="sizes"><img src="concept-1.png" alt="64像素"><img src="concept-1.png" alt="32像素"></div></article><article><img src="concept-2.png" alt="深色开发终端"><h2>02 · 深色终端</h2><p>墨绿底与浅色括号，强调独立的开发者工具身份。</p></article><article><img src="concept-3.png" alt="终端角标"><h2>03 · 终端角标</h2><p>放大原标，将 DEV 融入右下角的终端贴标。</p></article></main></html>
