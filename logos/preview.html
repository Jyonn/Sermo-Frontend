<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FRIENDEN 友间 Logo</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:40px;background:#eeeae1;color:#17372d;font-family:"Noto Sans SC",sans-serif}h1{margin:0 0 8px;font-size:32px}p{margin:0 0 28px;color:#607069}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{overflow:hidden;border:1px solid #d7d9d2;border-radius:22px;background:#fbfaf7}.stage{display:grid;min-height:280px;place-items:center}.stage img{width:190px;height:190px}.meta{padding:16px 18px;border-top:1px solid #e2e3dc}.meta strong{display:block}.sizes{display:flex;align-items:end;gap:18px;margin-top:12px}.sizes img:nth-child(1){width:64px}.sizes img:nth-child(2){width:32px}.sizes img:nth-child(3){width:16px}
  </style>
</head>
<body>
  <h1>FRIENDEN 友间</h1><p>三个图形方向及小尺寸识别检查</p>
  <div class="grid">
    <article class="card"><div class="stage"><img src="concepts/concept-1-open-room.svg" alt="相向空间" /></div><div class="meta"><strong>01 相向空间</strong><div class="sizes"><img src="concepts/concept-1-open-room.svg" alt=""/><img src="concepts/concept-1-open-room.svg" alt=""/><img src="concepts/concept-1-open-room.svg" alt=""/></div></div></article>
    <article class="card"><div class="stage"><img src="concepts/concept-2-between.svg" alt="对话之间" /></div><div class="meta"><strong>02 对话之间</strong><div class="sizes"><img src="concepts/concept-2-between.svg" alt=""/><img src="concepts/concept-2-between.svg" alt=""/><img src="concepts/concept-2-between.svg" alt=""/></div></div></article>
    <article class="card"><div class="stage"><img src="concepts/concept-3-threshold.svg" alt="友间门廊" /></div><div class="meta"><strong>03 友间门廊</strong><div class="sizes"><img src="concepts/concept-3-threshold.svg" alt=""/><img src="concepts/concept-3-threshold.svg" alt=""/><img src="concepts/concept-3-threshold.svg" alt=""/></div></div></article>
  </div>
</body>
</html>
